name: Generate Snake Animation

on:
  # හැමදාම රෑ 12 ට auto update වෙන්න
  schedule:
    - cron: "0 0 * * *"
  # Manual විදිහට run කරන්න
  workflow_dispatch:
  # Push කරපු ගමන් update වෙන්න
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: Platane/snk@v3
        with:
          # ඔයාගේ username එක
          github_user_name: wwwnadhun0270-maker
          # SVG files generate වෙන විදිහ
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          # Generate වෙන images 'output' කියන branch එකට save වෙනවා
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
